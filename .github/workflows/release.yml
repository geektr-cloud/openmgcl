name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: >
          go build -trimpath
          -ldflags="-s -w -X github.com/geektr-cloud/openmgcl/cmd.version=${GITHUB_REF_NAME}"
          -o dist/mgcl-linux-amd64 .

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: >
          go build -trimpath
          -ldflags="-s -w -X github.com/geektr-cloud/openmgcl/cmd.version=${GITHUB_REF_NAME}"
          -o dist/mgcl-linux-arm64 .

      - name: Smoke test
        run: |
          output=$(./dist/mgcl-linux-amd64 --version)
          echo "$output"
          echo "$output" | grep -qF "$GITHUB_REF_NAME"

      - name: Checksums
        run: cd dist && sha256sum mgcl-linux-amd64 mgcl-linux-arm64 > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/mgcl-linux-amd64
          dist/mgcl-linux-arm64
          dist/checksums.txt
          --title "${GITHUB_REF_NAME}"
          --generate-notes
