name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify checked-out tag
        run: test "$TAG" = "$(git describe --exact-match --tags HEAD)"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false

      - name: Test
        run: go test ./... -count=1

  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify checked-out tag
        run: test "$TAG" = "$(git describe --exact-match --tags HEAD)"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: >
          go build -trimpath
          -ldflags="-s -w -X github.com/geektr-cloud/openmgcl/cmd.version=${TAG}"
          -o dist/mgcl-linux-amd64 ./cmd/mgcl

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: >
          go build -trimpath
          -ldflags="-s -w -X github.com/geektr-cloud/openmgcl/cmd.version=${TAG}"
          -o dist/mgcl-linux-arm64 ./cmd/mgcl

      - name: Smoke test
        run: |
          output=$(./dist/mgcl-linux-amd64 --version)
          echo "$output"
          echo "$output" | grep -qF "$TAG"

      - name: Checksums
        run: |
          cd dist
          sha256sum mgcl-linux-amd64 mgcl-linux-arm64 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$TAG"
          dist/mgcl-linux-amd64
          dist/mgcl-linux-arm64
          dist/SHA256SUMS
          --title "OpenMgCl ${TAG}"
          --generate-notes
